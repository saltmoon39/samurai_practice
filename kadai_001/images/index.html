<!DOCTYPE html>
<html>
   <head>
    <title>My Profile</title>
    <meta charset="UTF-8">
    <meta name="description" content="Myprofileです">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  </head> 
  <body>
    <header>
        <div class="header">
            <div class="header-profile">MyProfile</div>
            <div class="header-nav">
                <a href="#about">About</a>
                <a href="#Works">Works</a>
            </div>
        </div>
    </header>
    <section class="top">
        <img src="images/main.png" alt="main">
    </section>
    <section class="about">
        <h1 class="h1">About</h1>
        <div class="about-inner">
            <img src="images/" alt="about">
            <div class="about-profile">
                <h3 class="h3">Kazuki Asahina</h3>
                <p>•25歳 長野県佐久市出身<br>•ソフトウェア業界でマーケティングに従事<br>
                    •趣味はカメラ、愛機はCanon<br>•自然を撮影するのが好きで、海や山によく行く
                </p>
            </div>
        </div>
    </section>
    <section class="Works">
        <h2 class="h2">Works</h2>
        <div class="works-inner">
            <div class="works-inner2">
                <img src="works1.png" alt="works1">
                <p>新潟に訪れた際に、日本海の雄大さに魅了されて撮影した1枚
                </p>
            </div>
        </div>
        <div class="works-inner2">
            <img src="works2.png" alt="works2">
            <p>地元長野の木曽町から撮影した、冠雪した御獄山</p>
        </div>
        <div class="works-inner2">
            <img src="works3.png" alt="works3">
            <p>京都で撮影した、明け方の古き良き日本の町並み</p>
        </div>
    </section>
    <footer>
        <p>&copy;MyProfile.All rights reserved.</p>
    </footer>
  </body>
</html>
